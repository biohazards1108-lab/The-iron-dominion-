name: Build Dominion Tokens
on:
  push:
    paths:
      - 'dominion-tokens/**'
      - '.github/workflows/build-dominion-tokens.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Build
        working-directory: dominion-tokens
        run: mvn -B package
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: DominionTokens
          path: dominion-tokens/target/*.jar
