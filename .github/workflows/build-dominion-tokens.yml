name: "Legacy: Build Dominion Tokens (manual only)"
on:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Legacy compatibility warning
        run: echo "This is an old Bukkit/Cauldron-era plugin. It is not compatible with Bedrock Dominion and must not be installed on the new server."
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Build
        working-directory: dominion-tokens
        run: mvn -B package
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: DominionTokens
          path: dominion-tokens/target/*.jar
