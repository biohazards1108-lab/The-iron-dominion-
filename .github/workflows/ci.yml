name: Iron Dominion CI

on:
  push:
  pull_request:

jobs:
  server-api-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: server/package.json
      - name: Install API dependencies
        working-directory: server
        run: npm install --ignore-scripts
      - name: Syntax check API
        working-directory: server
        run: npm run check
      - name: Verify API security controls
        run: |
          set -euo pipefail
          grep -q 'requireInternalKey' server/index.js
          grep -q 'requireAdminKey' server/index.js
          grep -q 'X-Iron-Dominion-Key' server/index.js
          grep -q 'BEGIN IMMEDIATE TRANSACTION' server/index.js
          grep -q 'balance >= ?' server/index.js

  legacy-bridge-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - name: Build legacy bridge
        working-directory: minecraft-plugin
        run: mvn -B -DskipTests package
      - name: Verify plugin JAR
        working-directory: minecraft-plugin
        shell: bash
        run: |
          set -euo pipefail
          test -f target/IronDominionTokens-1.0.0.jar
          jar tf target/IronDominionTokens-1.0.0.jar | grep -q 'plugin.yml'
          jar tf target/IronDominionTokens-1.0.0.jar | grep -q 'com/irondominion/tokens/DominionTokens.class'
          if jar tf target/IronDominionTokens-1.0.0.jar | grep -q 'com/irondom/shop/'; then
            echo 'Unexpected shop classes found in token plugin JAR.'
            exit 1
          fi
      - name: Upload DominionTokens JAR
        uses: actions/upload-artifact@v4
        with:
          name: DominionTokens-1.0.0
          path: minecraft-plugin/target/IronDominionTokens-1.0.0.jar
          if-no-files-found: error

  static-site-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate required public pages
        run: |
          set -euo pipefail
          for file in index.html join.html ranks.html economy.html leaderboard.html shop.html vote.html rules.html 404.html robots.txt sitemap.xml; do
            test -f "$file" || { echo "Missing required file: $file"; exit 1; }
          done
      - name: Validate local links and assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path('.')
          missing = []
          for page in root.glob('*.html'):
              text = page.read_text(encoding='utf-8')
              for attr in ('href', 'src'):
                  for value in re.findall(rf'{attr}=["\']([^"\']+)["\']', text, re.I):
                      if value.startswith(('#', 'http://', 'https://', 'mailto:', 'javascript:')):
                          continue
                      value = value.split('?', 1)[0].split('#', 1)[0]
                      if value and not (root / value).exists():
                          missing.append(f'{page}: {value}')
          if missing:
              print('\n'.join(missing))
              raise SystemExit('Broken local links/assets detected')
          PY
      - name: Reject accidental secrets
        run: |
          set -euo pipefail
          if grep -RInE 'discordapp\.com/api/webhooks|X-Iron-Dominion-Key[[:space:]]*:[[:space:]]*[A-Za-z0-9._-]{20,}|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY' --exclude-dir=.git --exclude='*.example' .; then
            echo 'Potential secret found in tracked source.'
            exit 1
          fi
