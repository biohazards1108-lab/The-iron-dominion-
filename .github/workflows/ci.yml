name: Iron Dominion Website CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: iron-dominion-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static-site-check:
    name: Validate public website
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate required public pages and metadata
        shell: bash
        run: |
          set -euo pipefail
          for file in index.html join.html mods.html ranks.html economy.html leaderboard.html shop.html vote.html rules.html 404.html robots.txt sitemap.xml favicon.svg manifest.webmanifest site.webmanifest; do
            test -s "$file" || { echo "Missing or empty required file: $file"; exit 1; }
          done
          test -s css/style.css
          test -s js/server.js

      - name: Validate local links and assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from urllib.parse import urlsplit
          import re
          root = Path('.')
          missing = []
          bad = []
          for page in root.glob('*.html'):
              text = page.read_text(encoding='utf-8')
              for attr in ('href', 'src'):
                  for raw in re.findall(rf'{attr}=["\']([^"\']+)["\']', text, re.I):
                      value = raw.strip()
                      if not value or value.startswith(('#', 'http://', 'https://', 'mailto:', 'tel:', 'data:', 'javascript:')):
                          continue
                      value = urlsplit(value).path
                      if not value:
                          continue
                      target = (root / value).resolve()
                      if root.resolve() not in target.parents and target != root.resolve():
                          bad.append(f'{page}: path escapes repository: {raw}')
                      elif not target.exists():
                          missing.append(f'{page}: {raw}')
                      elif target.is_dir():
                          bad.append(f'{page}: {raw} resolves to a directory')
          if missing or bad:
              if missing:
                  print('Missing local links/assets:')
                  print('\n'.join(missing))
              if bad:
                  print('Unsafe or invalid local links/assets:')
                  print('\n'.join(bad))
              raise SystemExit('Local link validation failed')
          print('All local HTML links and assets resolve.')
          PY

      - name: Validate strict CSP compatibility and metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re
          from urllib.parse import urlsplit
          import xml.etree.ElementTree as ET

          root = Path('.')
          failures = []
          for page in sorted(root.glob('*.html')):
              text = page.read_text(encoding='utf-8')
              if not re.search(r'<a\b[^>]*class=["\'][^"\']*\bskip-link\b[^"\']*["\'][^>]*href=["\']#main-content["\']', text, re.I):
                  failures.append(f'{page}: missing keyboard-accessible skip link')
              if not re.search(r'<main\b[^>]*id=["\']main-content["\']', text, re.I):
                  failures.append(f'{page}: missing main-content skip-link target')
              if re.search(r'<style\b|<script\b(?![^>]*\bsrc\s*=)[^>]*>|\sstyle\s*=|\son[a-z]+\s*=', text, re.I):
                  failures.append(f'{page}: inline style/script/handler conflicts with the strict CSP')
              if page.name != '404.html':
                  if not re.search(r'<link\s+rel=["\']canonical["\']', text, re.I):
                      failures.append(f'{page}: missing canonical URL')
                  if not re.search(r'<meta\s+name=["\']description["\']', text, re.I):
                      failures.append(f'{page}: missing meta description')

          for css in root.rglob('*.css'):
              text = css.read_text(encoding='utf-8')
              for raw in re.findall(r'url\(\s*["\']?([^)"\']+)', text, re.I):
                  value = raw.strip()
                  if not value or value.startswith(('data:', 'http://', 'https://', '#')):
                      continue
                  target = (css.parent / urlsplit(value).path).resolve()
                  if not target.exists():
                      failures.append(f'{css}: missing CSS asset {value}')

          for manifest in ('manifest.webmanifest', 'site.webmanifest'):
              try:
                  json.loads((root / manifest).read_text(encoding='utf-8'))
              except Exception as exc:
                  failures.append(f'{manifest}: invalid JSON ({exc})')

          try:
              ET.parse('favicon.svg')
          except Exception as exc:
              failures.append(f'favicon.svg: invalid SVG/XML ({exc})')

          if failures:
              print('\n'.join(failures))
              raise SystemExit('CSP/metadata/asset validation failed')
          print('CSP, metadata, manifests, favicon, and CSS asset paths validated.')
          PY

      - name: Validate canonical sitemap and robots.txt
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          namespace = '{http://www.sitemaps.org/schemas/sitemap/0.9}'
          root = ET.parse('sitemap.xml').getroot()
          urls = [node.text.strip() for node in root.iter(namespace + 'loc') if node.text]
          if not urls:
              raise SystemExit('Sitemap has no URLs')
          canonical = 'https://theirondominion.com/'
          required = {
              canonical,
              canonical + 'join.html',
              canonical + 'mods.html',
              canonical + 'ranks.html',
              canonical + 'economy.html',
              canonical + 'leaderboard.html',
              canonical + 'shop.html',
              canonical + 'vote.html',
              canonical + 'rules.html',
          }
          if not required.issubset(set(urls)):
              raise SystemExit(f'Sitemap is missing required public URLs: {sorted(required - set(urls))}')
          if len(urls) != len(set(urls)):
              raise SystemExit('Sitemap contains duplicate URLs')
          if any(not url.startswith(canonical) for url in urls):
              raise SystemExit('Sitemap contains a non-canonical domain')
          robots = Path('robots.txt').read_text(encoding='utf-8')
          if f'Sitemap: {canonical}sitemap.xml' not in robots:
              raise SystemExit('robots.txt does not advertise the canonical sitemap')
          print('Sitemap and robots.txt are consistent.')
          PY

      - name: Validate external links opened in new tabs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          for page in Path('.').glob('*.html'):
              text = page.read_text(encoding='utf-8')
              for match in re.finditer(r'<a\b[^>]*\btarget=["\']_blank["\'][^>]*>', text, re.I):
                  tag = match.group(0)
                  rel = re.search(r'\brel=["\']([^"\']*)["\']', tag, re.I)
                  if not rel or not {'noopener', 'noreferrer'}.intersection(set(rel.group(1).lower().split())):
                      raise SystemExit(f'{page}: target="_blank" link missing noopener/noreferrer')
          print('External new-tab links have safe rel attributes.')
          PY

      - name: Validate development status is not misrepresented
        run: |
          set -euo pipefail
          grep -q 'THE IRON DOMINION' index.html
          grep -q 'NOW ON BEDROCK' index.html
          grep -q 'Bedrock Dominion is in development' api/server.json
          grep -q 'IN DEVELOPMENT' js/server.js
          if grep -RInE 'the-iron-dominion-dev\.g\.akliz\.net|iron-dominion-wasteland-studios-projects\.vercel\.app|builder\.tebex\.io|biohazards1108-lab\.github\.io/The-iron-dominion-' --exclude-dir=.git --exclude='*.mp4' --exclude='ci.yml' .; then
            echo 'Legacy server host, store, or public-domain reference found.'
            exit 1
          fi

      - name: Reject accidental secrets
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE 'discordapp\.com/api/webhooks|X-Iron-Dominion-Key[[:space:]]*:[[:space:]]*[A-Za-z0-9._-]{20,}|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY' --exclude-dir=.git --exclude='*.example' --exclude='*.mp4' .; then
            echo 'Potential secret found in tracked source.'
            exit 1
          fi

  legacy-api-syntax:
    name: Syntax-check legacy API reference
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check server/index.js
          node --check api/health.js
          node --check api/server-status.js
          node --check api/tebex/webhook.js
