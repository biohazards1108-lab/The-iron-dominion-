name: Iron Dominion CI

on:
  push:
  pull_request:

jobs:
  legacy-bridge-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - name: Build legacy bridge
        working-directory: minecraft-plugin
        run: mvn -B -DskipTests package

  static-site-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate required public pages
        shell: bash
        run: |
          set -euo pipefail
          for file in index.html join.html ranks.html economy.html leaderboard.html shop.html vote.html rules.html 404.html robots.txt sitemap.xml; do
            test -f "$file" || { echo "Missing required file: $file"; exit 1; }
          done
      - name: Reject accidental secrets in public source
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE 'discordapp\.com/api/webhooks|X-Iron-Dominion-Key[[:space:]]*:[[:space:]]*[A-Za-z0-9._-]{20,}|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY' --exclude-dir=.git .; then
            echo "Potential secret found in tracked source."
            exit 1
          fi
