name: Build Official Iron Dominion Trailer

on:
  push:
    paths-ignore:
      - 'assets/Iron_Dominion_OFFICIAL_TRAILER.mp4'
      - 'assets/Iron_Dominion_OFFICIAL_TRAILER.sha256'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-trailer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install trailer tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python3 -m pip install --break-system-packages edge-tts

      - name: Build neural narration
        shell: bash
        run: |
          cat > /tmp/iron_dominion.txt <<'EOF'
          What if your Minecraft world became an empire?
          Welcome to Iron Dominion.
          Tekkit 1.6.4 survival built for builders, engineers, explorers, and creators.
          Build massive factories. Automate your production. Explore the world. Forge your own empire.
          Rise through the Dominion ranks, from Iron to Overlord.
          Join the community. Shape the world. Build something worth remembering.
          Visit the website. Check the store. Then join the Dominion.
          The Dominion awaits.
          EOF
          python3 -m edge_tts -f /tmp/iron_dominion.txt --voice en-US-ChristopherNeural --rate=-8% --pitch=-8Hz --write-media /tmp/voice.mp3

      - name: Build original industrial music
        run: |
          ffmpeg -y -f lavfi -i "sine=frequency=55:sample_rate=44100:duration=30" \
            -f lavfi -i "sine=frequency=110:sample_rate=44100:duration=30" \
            -f lavfi -i "sine=frequency=220:sample_rate=44100:duration=30" \
            -filter_complex "[0:a]volume=0.10[a0];[1:a]volume=0.045[a1];[2:a]volume=0.018[a2];[a0][a1][a2]amix=inputs=3:duration=first,afade=t=in:st=0:d=1,afade=t=out:st=27:d=3" \
            -c:a pcm_s16le /tmp/music.wav

      - name: Render finite video stream
        shell: bash
        run: |
          mkdir -p assets
          timeout 180s ffmpeg -y \
            -loop 1 -framerate 30 -i assets/iron-dominion-banner.webp \
            -t 30 \
            -vf "scale=1280:720:force_original_aspect_ratio=increase,crop=1280:720,format=yuv420p,eq=contrast=1.04:saturation=1.06,drawbox=x=0:y=0:w=1280:h=88:color=black@0.20:t=fill,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='IRON DOMINION':fontcolor=white:fontsize=42:x=34:y=24:shadowcolor=black@0.85:shadowx=2:shadowy=2" \
            -an -c:v libx264 -preset ultrafast -crf 25 -pix_fmt yuv420p -profile:v main -level 3.1 -movflags +faststart \
            /tmp/video_only.mp4

      - name: Mux audio and validate
        shell: bash
        run: |
          timeout 120s ffmpeg -y -i /tmp/video_only.mp4 -i /tmp/voice.mp3 -i /tmp/music.wav \
            -filter_complex "[1:a]volume=0.92,highpass=f=75,lowpass=f=10500,acompressor=threshold=-18dB:ratio=3:attack=8:release=120[vo];[2:a]volume=0.25[mus];[vo][mus]amix=inputs=2:duration=first,loudnorm=I=-14:TP=-1.5:LRA=8[a]" \
            -map 0:v:0 -map '[a]' -t 30 -c:v copy -c:a aac -b:a 160k -ar 48000 -movflags +faststart \
            assets/Iron_Dominion_OFFICIAL_TRAILER.mp4

          echo '--- FINAL VIDEO ---'
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,codec_type,width,height,pix_fmt,avg_frame_rate -of default=noprint_wrappers=1 assets/Iron_Dominion_OFFICIAL_TRAILER.mp4
          echo '--- FINAL AUDIO ---'
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name,codec_type,sample_rate,channels -of default=noprint_wrappers=1 assets/Iron_Dominion_OFFICIAL_TRAILER.mp4
          echo '--- FINAL DURATION ---'
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 assets/Iron_Dominion_OFFICIAL_TRAILER.mp4

          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_type -of csv=p=0 assets/Iron_Dominion_OFFICIAL_TRAILER.mp4)" = "video"
          test "$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_type -of csv=p=0 assets/Iron_Dominion_OFFICIAL_TRAILER.mp4)" = "audio"
          test "$(ffprobe -v error -show_entries format=duration -of csv=p=0 assets/Iron_Dominion_OFFICIAL_TRAILER.mp4 | awk '{exit !($1 >= 29.9 && $1 <= 30.2)}')"
          sha256sum assets/Iron_Dominion_OFFICIAL_TRAILER.mp4 > assets/Iron_Dominion_OFFICIAL_TRAILER.sha256

      - name: Commit trailer to website
        shell: bash
        run: |
          git config user.name 'Iron Dominion Build Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f assets/Iron_Dominion_MOON_SHOT.mp4 assets/Iron_Dominion_MOON_SHOT.sha256 2>/dev/null || true
          git add assets/Iron_Dominion_OFFICIAL_TRAILER.mp4 assets/Iron_Dominion_OFFICIAL_TRAILER.sha256
          git diff --cached --quiet && exit 0
          git commit -m 'Render browser-safe official trailer'
          git push
