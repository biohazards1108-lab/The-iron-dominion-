name: Build Official Iron Dominion Trailer

on:
  push:
    paths-ignore:
      - 'assets/Iron_Dominion_OFFICIAL_TRAILER.mp4'
      - 'assets/Iron_Dominion_OFFICIAL_TRAILER.sha256'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-trailer:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install trailer tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python3 -m pip install --break-system-packages edge-tts

      - name: Verify banner input
        run: |
          test -s assets/iron-dominion-banner.svg
          grep -q '<svg' assets/iron-dominion-banner.svg

      - name: Build neural narration
        run: |
          cat > /tmp/iron_dominion.txt <<'EOF'
          What if your Minecraft world became an empire?
          Welcome to Iron Dominion.
          Tekkit 1.6.4 survival built for builders, engineers, explorers, and creators.
          Build massive factories. Automate your production. Explore the world. Forge your own empire.
          Rise through the Dominion ranks, from Iron to Overlord.
          Join the community. Shape the world. Build something worth remembering.
          Visit the website. Check the store. Then join the Dominion.
          The Dominion awaits.
          EOF
          python3 -m edge_tts -f /tmp/iron_dominion.txt --voice en-US-ChristopherNeural --rate=-8% --pitch=-8Hz --write-media /tmp/voice.mp3
          test -s /tmp/voice.mp3

      - name: Build original industrial music
        run: |
          ffmpeg -y -f lavfi -i "sine=frequency=55:sample_rate=44100:duration=30" \
            -f lavfi -i "sine=frequency=110:sample_rate=44100:duration=30" \
            -f lavfi -i "sine=frequency=220:sample_rate=44100:duration=30" \
            -filter_complex "[0:a]volume=0.10[a0];[1:a]volume=0.045[a1];[2:a]volume=0.018[a2];[a0][a1][a2]amix=inputs=3:duration=first,afade=t=in:st=0:d=1,afade=t=out:st=27:d=3" \
            -c:a pcm_s16le /tmp/music.wav
          test -s /tmp/music.wav

      - name: Rasterize valid SVG banner once
        run: |
          ffmpeg -y -hide_banner -loglevel error \
            -i assets/iron-dominion-banner.svg \
            -vf "scale=1280:720:force_original_aspect_ratio=increase,crop=1280:720,format=yuv420p" \
            -frames:v 1 /tmp/banner.png
          test -s /tmp/banner.png

      - name: Render browser-safe video stream
        run: |
          rm -f /tmp/video_only.mp4 assets/Iron_Dominion_OFFICIAL_TRAILER.mp4
          ffmpeg -y -hide_banner -loglevel error \
            -loop 1 -framerate 30 -i /tmp/banner.png -t 30 \
            -c:v libx264 -preset ultrafast -crf 25 -profile:v main -level 3.1 -pix_fmt yuv420p \
            -movflags +faststart /tmp/video_only.mp4
          test -s /tmp/video_only.mp4
          ffprobe -v error -select_streams v:0 \
            -show_entries stream=codec_name,width,height,pix_fmt,avg_frame_rate \
            -of default=noprint_wrappers=1 /tmp/video_only.mp4

      - name: Mux narration and music
        run: |
          ffmpeg -y -hide_banner -loglevel error \
            -i /tmp/video_only.mp4 -i /tmp/voice.mp3 -i /tmp/music.wav \
            -filter_complex "[1:a]volume=0.92,highpass=f=75,lowpass=f=10500,acompressor=threshold=-18dB:ratio=3:attack=8:release=120[vo];[2:a]volume=0.25[mus];[vo][mus]amix=inputs=2:duration=first,loudnorm=I=-14:TP=-1.5:LRA=8[a]" \
            -map 0:v:0 -map '[a]' -t 30 \
            -c:v copy -c:a aac -b:a 160k -ar 48000 -movflags +faststart \
            assets/Iron_Dominion_OFFICIAL_TRAILER.mp4

      - name: Validate final MP4
        run: |
          test -s assets/Iron_Dominion_OFFICIAL_TRAILER.mp4
          V=$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_type -of csv=p=0 assets/Iron_Dominion_OFFICIAL_TRAILER.mp4)
          A=$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_type -of csv=p=0 assets/Iron_Dominion_OFFICIAL_TRAILER.mp4)
          D=$(ffprobe -v error -show_entries format=duration -of csv=p=0 assets/Iron_Dominion_OFFICIAL_TRAILER.mp4)
          echo "VIDEO=$V AUDIO=$A DURATION=$D"
          test "$V" = video
          test "$A" = audio
          awk -v d="$D" 'BEGIN { exit !(d >= 29.9 && d <= 30.2) }'
          sha256sum assets/Iron_Dominion_OFFICIAL_TRAILER.mp4 > assets/Iron_Dominion_OFFICIAL_TRAILER.sha256

      - name: Commit trailer to website
        run: |
          git config user.name 'Iron Dominion Build Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f assets/Iron_Dominion_MOON_SHOT.mp4 assets/Iron_Dominion_MOON_SHOT.sha256 2>/dev/null || true
          git add assets/Iron_Dominion_OFFICIAL_TRAILER.mp4 assets/Iron_Dominion_OFFICIAL_TRAILER.sha256
          git diff --cached --quiet && exit 0
          git commit -m 'Fix official trailer render source'
          git push
