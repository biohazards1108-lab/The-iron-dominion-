name: Build Bedrock Dominion Development Teaser

# This is manual-only. A normal website edit must never regenerate or overwrite
# a video with unverified server claims.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bedrock-dominion-teaser
  cancel-in-progress: false

jobs:
  build-teaser:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install trailer tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python3 -m pip install --break-system-packages edge-tts

      - name: Build narration
        run: |
          cat > /tmp/bedrock_dominion.txt <<'EOF'
          A new world is taking shape.
          Welcome to the Iron Dominion.
          Meet Bedrock Dominion, our next Minecraft server project.
          A new realm. A growing community. A world still being forged.
          Custom features are in development.
          Server details will be shared after they are tested and confirmed.
          Follow the journey. Join the community.
          The Dominion is being built.
          EOF
          python3 -m edge_tts -f /tmp/bedrock_dominion.txt --voice en-US-ChristopherNeural --rate=-8% --pitch=-8Hz --write-media /tmp/voice.mp3
          test -s /tmp/voice.mp3

      - name: Build original atmospheric music
        run: |
          ffmpeg -y -hide_banner -loglevel error \
            -f lavfi -i "sine=frequency=55:sample_rate=44100:duration=30" \
            -f lavfi -i "sine=frequency=110:sample_rate=44100:duration=30" \
            -f lavfi -i "sine=frequency=220:sample_rate=44100:duration=30" \
            -filter_complex "[0:a]volume=0.10[a0];[1:a]volume=0.045[a1];[2:a]volume=0.018[a2];[a0][a1][a2]amix=inputs=3:duration=first,afade=t=in:st=0:d=1,afade=t=out:st=27:d=3" \
            -c:a pcm_s16le /tmp/music.wav
          test -s /tmp/music.wav

      - name: Render development teaser
        run: |
          ffmpeg -y -hide_banner -loglevel error \
            -f lavfi -i "color=c=0x070a0d:s=1280x720:r=30:d=30" \
            -vf "drawbox=x=0:y=0:w=1280:h=720:color=0x17090c@0.72:t=fill,drawbox=x=38:y=38:w=1204:h=644:color=0x7f1d1d@0.65:t=4,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='THE IRON DOMINION':fontcolor=white:fontsize=54:x=(w-tw)/2:y=145:shadowcolor=black@0.9:shadowx=3:shadowy=3,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='NOW ON BEDROCK':fontcolor=0xef4444:fontsize=38:x=(w-tw)/2:y=220:shadowcolor=black@0.9:shadowx=2:shadowy=2,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:text='BEDROCK DOMINION':fontcolor=0xf2f4f5:fontsize=32:x=(w-tw)/2:y=330:shadowcolor=black@0.9:shadowx=2:shadowy=2,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='IN DEVELOPMENT':fontcolor=0xffb3b8:fontsize=28:x=(w-tw)/2:y=395:shadowcolor=black@0.9:shadowx=2:shadowy=2,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:text='FOLLOW THE BUILD  •  JOIN THE COMMUNITY':fontcolor=white:fontsize=22:x=(w-tw)/2:y=610:shadowcolor=black@0.8:shadowx=2:shadowy=2,format=yuv420p" \
            -c:v libx264 -preset ultrafast -crf 23 -profile:v main -level 3.1 -pix_fmt yuv420p -movflags +faststart \
            -t 30 /tmp/video_only.mp4
          test -s /tmp/video_only.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,pix_fmt,avg_frame_rate -of default=noprint_wrappers=1 /tmp/video_only.mp4

      - name: Mux narration and music
        run: |
          ffmpeg -y -hide_banner -loglevel error \
            -i /tmp/video_only.mp4 -i /tmp/voice.mp3 -i /tmp/music.wav \
            -filter_complex "[1:a]volume=0.92,highpass=f=75,lowpass=f=10500,acompressor=threshold=-18dB:ratio=3:attack=8:release=120[vo];[2:a]volume=0.25[mus];[vo][mus]amix=inputs=2:duration=first,loudnorm=I=-14:TP=-1.5:LRA=8[a]" \
            -map 0:v:0 -map '[a]' -t 30 \
            -c:v copy -c:a aac -b:a 160k -ar 48000 -movflags +faststart \
            assets/Bedrock_Dominion_DEVELOPMENT_TEASER.mp4

      - name: Validate final teaser
        run: |
          set -euo pipefail
          VIDEO=assets/Bedrock_Dominion_DEVELOPMENT_TEASER.mp4
          test -s "$VIDEO"
          V=$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_type -of csv=p=0 "$VIDEO")
          A=$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_type -of csv=p=0 "$VIDEO")
          D=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$VIDEO")
          VC=$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$VIDEO")
          AC=$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of csv=p=0 "$VIDEO")
          echo "VIDEO=$V CODEC=$VC AUDIO=$A CODEC=$AC DURATION=$D"
          test "$V" = video
          test "$A" = audio
          test "$VC" = h264
          test "$AC" = aac
          awk -v d="$D" 'BEGIN { exit !(d >= 29.9 && d <= 30.2) }'
          sha256sum "$VIDEO" > assets/Bedrock_Dominion_DEVELOPMENT_TEASER.sha256

      - name: Commit development teaser
        run: |
          set -euo pipefail
          git config user.name 'Iron Dominion Build Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/Bedrock_Dominion_DEVELOPMENT_TEASER.mp4 assets/Bedrock_Dominion_DEVELOPMENT_TEASER.sha256
          git diff --cached --quiet && exit 0
          git commit -m 'Build Bedrock Dominion development teaser'
          git push
