name: Iron Dominion NPCs CI

on:
  push:
    paths:
      - 'npc-plugin/**'
      - '.github/workflows/npcs.yml'
  pull_request:
    paths:
      - 'npc-plugin/**'
      - '.github/workflows/npcs.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - name: Build NPC plugin
        working-directory: npc-plugin
        run: mvn -B -DskipTests package
      - name: Verify legacy bytecode and plugin contents
        working-directory: npc-plugin
        shell: bash
        run: |
          set -euo pipefail
          test -f target/IronDominionNPCs-1.1.0.jar
          jar tf target/IronDominionNPCs-1.1.0.jar | grep -q 'plugin.yml'
          jar tf target/IronDominionNPCs-1.1.0.jar | grep -q 'config.yml'
          jar tf target/IronDominionNPCs-1.1.0.jar | grep -q 'com/irondominion/npcs/IronDominionNPCs.class'
          major=$(javap -verbose -classpath target/IronDominionNPCs-1.1.0.jar com.irondominion.npcs.IronDominionNPCs | awk '/major version/ {print $3; exit}')
          test "$major" = "50"
          unzip -p target/IronDominionNPCs-1.1.0.jar plugin.yml | grep -q '^version: 1.1.0$'
      - name: Verify Forge/Cauldron 1.6.4 engine
        working-directory: npc-plugin
        shell: bash
        run: |
          set -euo pipefail
          source=src/main/java/com/irondominion/npcs/IronDominionNPCs.java
          test -f "$source"
          grep -q 'net.minecraft.entity.passive.EntityVillager' "$source"
          grep -q 'net.minecraft.world.World' "$source"
          grep -q 'net.minecraft.entity.Entity' "$source"
          grep -q 'spawnEntityInWorld' "$source"
          grep -q 'getBukkitEntity' "$source"
          grep -q 'getHandle' "$source"
          grep -q 'private Method method' "$source"
          grep -q 'setLocationAndAngles' "$source"
          grep -q 'setPositionAndRotation' "$source"
          grep -q 'posX' "$source"
          grep -q 'posY' "$source"
          grep -q 'posZ' "$source"
          grep -q 'NPC SPAWN SUCCESS' "$source"
          grep -q 'NPC POST-TICK ALIVE' "$source"
          grep -q 'spawnBukkit' "$source"
          javap -classpath target/IronDominionNPCs-1.1.0.jar -p com.irondominion.npcs.IronDominionNPCs | grep -q 'spawnNms'
          javap -classpath target/IronDominionNPCs-1.1.0.jar -p com.irondominion.npcs.IronDominionNPCs | grep -q 'spawnBukkit'
      - name: Upload NPC plugin
        uses: actions/upload-artifact@v4
        with:
          name: IronDominionNPCs-1.1.0
          path: npc-plugin/target/IronDominionNPCs-1.1.0.jar
          if-no-files-found: error
