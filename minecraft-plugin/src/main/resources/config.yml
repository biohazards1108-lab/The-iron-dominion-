# Iron Dominion Bridge configuration
# NEVER commit real API keys or Tebex secrets here.
# Set the api-key and Tebex secret in plugins/IronDominionBridge/config.yml on the server.

api:
  # Legacy Bukkit/Cauldron bridge only; not compatible with Bedrock Dominion.
  # Leave blank until a reviewed legacy API is intentionally configured.
  url: ""
  api-key: "REPLACE_ON_SERVER"
  connect-timeout-ms: 5000
  read-timeout-ms: 5000
  require-https: true

tebex:
  # Game Server secret from Tebex Creator Panel -> Game Servers -> Edit.
  # Keep this server-local. It is NOT the webhook secret.
  secret: "REPLACE_ON_SERVER"

status:
  update-seconds: 60

delivery:
  # Tebex supplies the next queue-check interval after a successful response.
  # This value is only the initial safety interval before the first response.
  poll-seconds: 90

voting:
  enabled: false
  tokens-per-verified-vote: 1
  duplicate-protection: true

store:
  # Enable only after api-key and Tebex secret are configured locally on the server.
  enabled: false
