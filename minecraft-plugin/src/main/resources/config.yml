# Iron Dominion Bridge configuration
# NEVER commit real API keys or Tebex secrets here.
# Set these values in the generated plugins/IronDominionBridge/config.yml on the server.

api:
  url: "https://REPLACE_WITH_PRODUCTION_API_HOST"
  api-key: "REPLACE_ON_SERVER"
  connect-timeout-ms: 5000
  read-timeout-ms: 5000
  require-https: true

tebex:
  # Game Server secret from Tebex Creator Panel -> Game Servers -> Edit.
  # Keep this server-local. It is NOT the webhook secret.
  secret: "REPLACE_ON_SERVER"

status:
  update-seconds: 60

delivery:
  # Tebex tells clients the correct next-check interval. This value is only
  # the initial safety interval before the first successful queue response.
  poll-seconds: 90

voting:
  enabled: false
  tokens-per-verified-vote: 1
  duplicate-protection: true

store:
  enabled: false
