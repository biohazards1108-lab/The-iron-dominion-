name: IronDominionBridge
version: 1.1.0
main: com.irondom.shop.IronDominionShop
description: Iron Dominion website status and secure Tebex bridge for Tekkit 1.6.4/Cauldron
author: Iron Dominion
commands:
  domshop:
    description: View Iron Dominion store information
    usage: /domshop
  domadmin:
    description: Iron Dominion bridge administration
    usage: /domadmin <status|reload>
    permission: irondominion.admin
permissions:
  irondominion.admin:
    description: Allows Iron Dominion bridge administration
    default: op
