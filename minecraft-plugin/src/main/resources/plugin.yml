name: IronDominionBridge
version: 1.0.0
main: com.irondom.shop.IronDominionShop
description: Secure legacy-server bridge for the Iron Dominion website backend
author: Iron Dominion

commands:
  domshop:
    description: View the Dominion support/store integration status
    usage: /domshop
  domadmin:
    description: Administrative Iron Dominion backend commands
    usage: /domadmin <addtokens|status|sync>
    permission: irondom.admin

permissions:
  irondom.admin:
    description: Administrative access to Iron Dominion backend commands
    default: op
